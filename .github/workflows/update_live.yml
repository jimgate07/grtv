name: Update Facebook Live ID

on:
  schedule:
    # Τρέχει αυτόματα κάθε 30 λεπτά
    - cron: '0 */2 * * *'
  workflow_dispatch: # Επιτρέπει και χειροκίνητη εκτέλεση (Run workflow) από το GitHub

jobs:
  update-id:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run script to get live ID
        run: cd ./core/platforms/ python get_live.py

      - name: Commit and push if it changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add live-id.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Facebook Live ID" && git push)
